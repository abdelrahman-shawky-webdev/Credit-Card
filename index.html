<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>3D Glass Credit Card</title>
</head>
<body>
    <div class="card-container">
        <div class="card">
            <div class="card-front">
            <p class="name-bank">NATIONAL BANK OF EGYPT</p>
            <span class="credit">CREDIT</span>
            <i class="fa-solid fa-wifi"></i>
            <div class="chip"></div>
            <p class="number">5466 2322 7854 0195</p>
            <p class="name">Abdelrahman Shawky</p>
            <span class="date">Ex Date: 09/30</span>
            <span class="logo">Visa</span>
        </div>
        <div class="card-back">
            <div class="line"></div>
            <div class="code-cvv"><span class="cvv">936</span></div>
            <p class="services">For more information call 19453 <br>
               From outside Egypt call 002 03 19453</p>
        </div>
        </div>
    </div>
</body>
</html>
